name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app tests scripts
      - name: Unit and integration tests
        run: python -m pytest tests --maxfail=8
      - name: Report skipped browser tests
        if: always()
        run: |
          if python -m pytest tests/test_mobile_accessibility.py -q --collect-only 2>/dev/null | grep -q skipped; then
            echo "BLOCKED_BY_EXTERNAL_DEPENDENCY: Chromium/playwright browser smoke is skipped in this runner"
          fi

  security-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets and sqlite binaries
        run: |
          if git grep -I -nE 'ik_[0-9a-f]{16,}|nvapi-[A-Za-z0-9_-]{8,}|BEGIN OPENSSH PRIVATE KEY' -- ':!docs/**' ':!*.md' | grep -v test; then
            echo "possible secret in tracked files" >&2
            exit 1
          fi
          if git ls-files '*.sqlite' '*.sqlite3' | grep .; then
            echo "sqlite binaries must not be committed" >&2
            exit 1
          fi
