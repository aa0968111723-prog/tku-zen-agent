<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>淡江大學領袖禪學社 · AI 代理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧘</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 部署模式：需要存取碼 -->
<div id="gate" class="gate" hidden>
  <form class="gate-card" id="gate-form">
    <span class="mark" aria-hidden="true"></span>
    <h1>淡江大學領袖禪學社</h1>
    <p>這是社團幹部專用的 AI 代理，請輸入存取碼。</p>
    <input type="password" id="gate-token" placeholder="存取碼" autocomplete="current-password" required>
    <button type="submit">進入</button>
    <p class="gate-error" id="gate-error" hidden></p>
  </form>
</div>

<div id="app" hidden>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div class="brand-text">
      <strong>淡江大學領袖禪學社</strong>
      <span id="term-label">專屬 AI 代理</span>
    </div>
  </div>

  <div class="controls">
    <label class="field">
      <span>產出落點</span>
      <select id="destination">
        <option value="local">本機</option>
        <option value="drive">Google 雲端</option>
        <option value="both">本機＋雲端</option>
      </select>
    </label>
    <label class="field">
      <span>模型</span>
      <select id="model"></select>
    </label>
    <button id="term-btn" class="ghost" type="button" title="設定本學期的社長、社課時間等資料">本學期設定</button>
    <button id="reset" class="ghost" type="button" title="清空對話重新開始">新對話</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="chat" class="chat" aria-live="polite">
  <section class="welcome" id="welcome">
    <h1>今天要做什麼？</h1>
    <p class="lede">
      我讀得到社團知識庫、八份任務劇本，還有 108–115 學年度的歷年檔案。
      說一句就好，我會直接把檔案做出來。
    </p>
    <div class="chips" id="chips">
      <button type="button" data-prompt="幫我做一份 115 學年度上學期的社課排程表，18 週，欄位要有週次、日期、主題、帶課者、需要準備的器材、備註。">社課排程表</button>
      <button type="button" data-prompt="幫我做這學期的招生企劃，要包含目標人數、招生管道、時程、分工、預算，還有可以直接用的文案範例。">招生企劃書</button>
      <button type="button" data-prompt="做一份新生報名表的 Google 表單，要收基本資料、系級、怎麼知道我們社團的、有沒有靜坐經驗、想從社團得到什麼。">新生報名表</button>
      <button type="button" data-prompt="幫我做期初茶會的企劃書跟活動細流。">期初茶會</button>
      <button type="button" data-prompt="做一份社團經費預算表，收入跟支出分開，支出分社課、營隊、文宣、器材、雜支，小計跟結餘要用公式。">經費預算表</button>
      <button type="button" data-prompt="幫我寫三則招生用的 IG 貼文，語氣要生活化、貼近大學生，每則都要有 hashtag。">IG 招生貼文</button>
      <button type="button" data-prompt="幫我做幹部交接手冊，說明每個職位在做什麼、一年的工作節奏、交接要交什麼東西。">幹部交接手冊</button>
      <button type="button" data-prompt="幫我做這學年度的社團評鑑年度績效報告。">社團評鑑報告</button>
    </div>
  </section>
</main>

<footer class="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="例如：幫我做一份挑戰營的器材清單和分工表…（Enter 送出，Shift+Enter 換行）"></textarea>
    <button id="send" type="button" aria-label="送出">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
    </button>
  </div>
  <p class="hint" id="hint"></p>
</footer>

</div>

<!-- 本學期設定 -->
<div id="term-modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="term-title">
    <header class="modal-head">
      <h2 id="term-title">本學期設定</h2>
      <button class="icon-btn" id="term-close" type="button" aria-label="關閉">×</button>
    </header>
    <p class="modal-lede">
      這裡是<strong>今年事實的唯一來源</strong>。留空代表「還沒確認」——
      代理會直接說不知道，並在產出的檔案裡填「待填」，不會拿歷年資料頂替。
      寧可留空，不要填錯。
    </p>
    <form id="term-form" class="term-form"></form>
    <footer class="modal-foot">
      <span id="term-status" class="term-status"></span>
      <button class="ghost" id="term-cancel" type="button">取消</button>
      <button class="primary" id="term-save" type="button">儲存</button>
    </footer>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
